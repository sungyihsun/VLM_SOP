name: Search Nampo-dong samgyetang candidates

on:
  push:
    branches: [DEV]
    paths:
      - scripts/busan-trip/search_nampo_samgyetang.py
      - scripts/busan-trip/fetch_details_nampo_samgyetang.py
      - .github/workflows/search-nampo-samgyetang.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: DEV

      - name: Search 南浦洞 samgyetang candidates
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          test -n "$GOOGLE_PLACES_API_KEY"
          python3 scripts/busan-trip/search_nampo_samgyetang.py

      - name: Pick final 3 and fetch details
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          # Only 3 genuine samgyetang (chicken_restaurant-typed) candidates
          # turned up within 3km of 南浦洞 even after widening the radius and
          # query set — this downtown neighborhood just doesn't have many
          # dedicated samgyetang shops (Busan's samgyetang cluster is mostly
          # around Dongnae, much further away). All 3 are taken as the final
          # list since the user asked for exactly the top 3.
          python3 -c "
          import json
          final = ['宮中蔘雞湯', '형과아우누룽지삼계탕&왕갈비탕 부평점', '明星(名聲)一隻雞']
          json.dump(final, open('candidate-results/nampo-samgyetang-final-list.json', 'w'), ensure_ascii=False, indent=2)
          "
          python3 scripts/busan-trip/fetch_details_nampo_samgyetang.py

      - name: Publish candidate results to DEV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate-results/nampo-samgyetang-anchor.json candidate-results/nampo-samgyetang-candidates.json candidate-results/nampo-samgyetang-final-list.json candidate-results/nampo-samgyetang-details.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish Nampo-dong samgyetang candidates"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto latest DEV and retrying ($i)"
            git fetch origin DEV
            git rebase origin/DEV
          done
          exit 1
